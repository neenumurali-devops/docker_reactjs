name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - master        # Change to main if your branch is main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test -- --watchAll=false

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      ####################################################
      # Login to Nexus Docker Registry
      ####################################################
      - name: Login to Nexus
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login \
          http://${{ secrets.NEXUS_URL }} \
          -u "${{ secrets.NEXUS_USERNAME }}" \
          --password-stdin

      ####################################################
      # Build Docker Image
      ####################################################
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.NEXUS_URL }}/docker-reactjs:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/docker-reactjs:latest \
            .

      ####################################################
      # Push to Nexus
      ####################################################
      - name: Push Image to Nexus
        run: |
          docker push ${{ secrets.NEXUS_URL }}/docker-reactjs:latest

      ####################################################
      # Login to Docker Hub
      ####################################################
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ####################################################
      # Push to Docker Hub
      ####################################################
      - name: Push Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/docker-reactjs:latest

      ####################################################
      # Deploy to EC2
      ####################################################
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/docker-reactjs

            docker compose pull
            docker compose down || true
            docker compose up -d --remove-orphans

            docker image prune -f
