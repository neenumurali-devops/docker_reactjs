name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - master   # Change to main if your default branch is main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test -- --watchAll=false
        continue-on-error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/docker-reactjs:latest
            ${{ secrets.DOCKER_USERNAME }}/docker-reactjs:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Logging into Docker Hub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
              -u "${{ secrets.DOCKER_USERNAME }}" \
              --password-stdin

            echo "Pulling latest image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/docker-reactjs:latest

            echo "Logging into Nexus..."
            echo "${{ secrets.NEXUS_PASSWORD }}" | docker login \
              13.232.115.150:8082 \
              -u "${{ secrets.NEXUS_USERNAME }}" \
              --password-stdin

            echo "Tagging image for Nexus..."
            docker tag \
              ${{ secrets.DOCKER_USERNAME }}/docker-reactjs:latest \
              13.232.115.150:8082/docker-reactjs:latest

            echo "Pushing image to Nexus..."
            docker push 13.232.115.150:8082/docker-reactjs:latest

            echo "Deploying application..."
            cd /home/ec2-user/docker-reactjs

            docker compose pull

            docker compose down || true

            docker rm -f react-app || true

            docker compose up -d --remove-orphans
            docker image prune -f

            echo "Deployment completed successfully."
